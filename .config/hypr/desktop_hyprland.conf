
#
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
#

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto


#the below monitor configuration is for standard us of 4k monitor with no scaleing but same configuration as up top
monitor=HDMI-A-1,3440x1440@85,2320x0,1,bitdepth,8 #MAIN_MONITOR ultrawide
monitor=DP-2,3840x2160,0x1440,1,bitdepth,8 #4k monitor
monitor=DP-1,1920x1080,3840x1440,1,bitdepth,8#1080 p

monitor=,preferred,auto,1






# See https://wiki.hyprland.org/Configuring/Keywords/ for more

env = LOWER_VOLUME_LOCK,unlocked
env = RAISE_VOLUME_LOCK,unlocked
env = VPN_MACHINE_NAME,fedora-desktop


# Execute your favorite apps at launch
exec-once = hypridle &
exec-once = ags &
exec-once = wlsunset -l 33.9 -L -89.3 &

exec-once = hyprpaper
exec-once = systemctl --user start opentabletdriver.service
# Some default env vars.
env = XCURSOR_SIZE,24
env = CYCLES_CUDA_EXTRA_CFLAGS,"-ccbin gcc -allow-unsupported-compiler"

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    float_switch_override_focus = 2
    #focus_on_activate=true

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    blur {
        enabled = true
        passes = 3
    }
    rounding = 5
    drop_shadow = yes
    shadow_range = 20
    shadow_render_power = 2
    col.shadow = rgba(1a1a1aee)
}


animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = off
}


workspace = HDMI-A-1,name:art

#workspace rules
workspace = name:art,monitor:HDMI-A-2

# Example windowrule v1
 windowrule = float, ^(Spotify)$
 windowrule = move 25% 25%, ^(Spotify)$
 windowrule = size 1000 800, ^(Spotify)$

#windowrulev2 = forceinput,windowdance,title:^()$,class:^(Unity)$
windowrulev2 = stayfocused,title:^(Color)$,class:^(Unity)$
#windowrulev2 = stayfocused,title:^(UnityEditor.AddComponent.AddComponentWindow)$,class:^(Unity)$
windowrulev2 = stayfocused,title:^(UnityEditor).*$,class:^(Unity)$
windowrulev2 = stayfocused,title:^(Select Preset)$,class:^(Unity)$
windowrulev2 = stayfocused,title:^(Select Render Texture)$,class:^(Unity)$






 windowrule = float, ^(rofi)$
 windowrule = center , ^(Rofi)$


windowrulev2 = workspace name:art, fullscreen, class:(krita), title:(Krita)
# Example windowrule v2

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER


# BIND //Screen shots // Take screen shot of region // Super + P ##
bind=SUPER_SHIFT,P,exec, grim -g "$(slurp)"
# BIND // KEYBIND // open terminal // Super + Enter ##
bind = $mainMod, RETURN, exec, kitty
# BIND // WINDOW // Close window // Super + C ##
bind = $mainMod, C, killactive, 
# BIND // EXIT // exit hyprland // Super + M ##
bind = $mainMod, M, exit, 
# BIND // WINDOW // Toggle floating // Super + V ##
bind = $mainMod, V, togglefloating, 
# BIND // WINDOW // Toggle fullscreen // Super + F ##
bind = $mainMod, F, fullscreen,
bind = $mainMod, R, exec, exec, ~/.config/rofi/launchers/type-6/launcher.sh 
bind = $mainMod, P, pseudo, # dwindle
# BIND // KEYBIND // Restart AGS // Super + k ##
bind = $mainMod, k, exec, killall -q ags & sleep 1s && ags



# Move focus with mainMod + arrow keys
# BIND // WINDOW // Move focus // Super + [left, right, up, down] ##
bind = $mainMod SHIFT, left, movefocus, l
bind = $mainMod SHIFT, right, movefocus, r
bind = $mainMod SHIFT, up, movefocus, u
bind = $mainMod SHIFT, down, movefocus, d

# for below see dispatchers in wiki
# Workspaces // go to next workspace on monitor // Super + [left, right] ##
# BIND // WORKSPACE // go to next workspace on monitor // Super + [left, right] ##
bind = $mainMod, left, workspace, m-1
bind = $mainMod, right, workspace, m+1


# Workspaces // go to next EMPTY workspace on monitor // Super + ALT + [left, right] ##
# BIND // WORKSPACE // go to next EMPTY workspace on monitor // Super + ALT + [left, right] ##
bind = $mainMod ALT, right, workspace, empty

# Workspaces // Move window to next workspace on monitor // Super + ctl +  right ##
#bind = $mainMod CTL, right, movetoworkspace, m+1

# Switch workspaces with mainMod + [0-9]
# BIND // WORKSPACE // switch to specific workspace // Super + [0-9] ##
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, a, workspace, art

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# BIND // WORKSPACE // move window to specific workspace // Super + SHIFT + [0-9] ##
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# BIND // Lock screen // Super + L ##
bind = SUPER_SHIFT, l, exec, hyprlock

# scratchpad // Move window to scratch pad // Super + s ##
# BIND // SCRATCHPAD // Move window to scratch pad // Super + s ##
bind = $mainMod, s, movetoworkspace, special
# BIND // SCRATCHPAD // Toggle scratch pad // Super + t ##
bind = $mainMod, t, togglespecialworkspace



# BIND // WORKSPACE // Scroll through existing workspaces // Super + [scroll] ##
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# BIND // WINDOW // Move/resize windows // Super + [left, right] mouse drag ##
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hyprland // Help menu // Super + H ##
# bind = $mainMod, H, exec, rofi -modi shortcut:~/.config/eww/scripts/shortcut.sh -show shortcut -theme ~/.config/waybar/rofi_configs/launcher.rasi


# BIND // VOLUME // Volume up // Super + (plus button) ##
bind=$mainMod,code:21,exec,ags -r "open_close_volume_indicator(true)"
#bind=$mainMod,code:21,exec, ~/.config/eww/scripts/eww_volume_bar.sh --up

# Volume // Volume down // Super + (plus button) ##
bind=$mainMod,code:20,exec,ags -r "open_close_volume_indicator(false)"
#bind=$mainMod,code:20,exec, ~/.config/eww/scripts/eww_volume_bar.sh --down


# BIND // KEYBIND // okpen launcher // Super + B ##
bind=$mainMod, SPACE, exec, ~/.config/ags/scripts/open_launcher.sh
# ags -r "on_close_launcher(true)"
# back kup in case you want to use rofi // KEYBIND // run launcher // Super + Space ##
#bind = $mainMod, SPACE, exec, ~/.config/rofi/launchers/type-6/launcher.sh 

# BIND // KEYBIND // Ai Assistant // Super + H 
bind = $mainMod, H, exec,ags -r "open_close_gpt(true)"




